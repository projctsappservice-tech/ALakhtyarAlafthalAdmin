<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم البيانات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 30px 20px;
            direction: rtl;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #1a2f44;
            font-weight: 300;
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subtitle {
            color: #5a6b7a;
            margin-bottom: 25px;
            border-right: 4px solid #00b4d8;
            padding-right: 15px;
        }
        .refresh-btn {
            background: #00b4d8;
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
            margin-left: 10px;
        }
        .refresh-btn:hover {
            background: #0095b6;
            transform: scale(1.02);
        }
        .delete-all-btn {
            background: #e53e3e;
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .delete-all-btn:hover {
            background: #c53030;
            transform: scale(1.02);
        }
        .delete-all-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .table-wrapper {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
            padding: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 800px;
        }
        thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }
        th {
            padding: 16px 12px;
            text-align: right;
            font-weight: 600;
            color: #2d3748;
            white-space: nowrap;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #edf2f7;
            color: #2d3748;
            vertical-align: middle;
        }
        tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: #f7fafc;
        }
        .row-number {
            font-weight: 600;
            color: #718096;
            text-align: center;
        }
        .thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #edf2f7;
            border: 1px solid #e2e8f0;
            display: block;
        }
        .no-image {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #a0aec0;
        }
        .map-link {
            color: #00b4d8;
            text-decoration: none;
            font-weight: 500;
        }
        .map-link:hover {
            text-decoration: underline;
        }
        .status-msg {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }
        .delete-btn {
            background: #fc8181;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: #e53e3e;
            transform: scale(1.05);
        }
        .delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            max-width: 650px;
            width: 100%;
            border-radius: 32px;
            padding: 30px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: fadeUp 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            left: 20px;
            background: #f1f4f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            color: #4a5568;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: #e2e8f0;
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a2f44;
            margin-bottom: 20px;
            padding-left: 40px;
        }
        .detail-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .detail-label {
            width: 110px;
            font-weight: 600;
            color: #4a5568;
            flex-shrink: 0;
        }
        .detail-value {
            color: #1a202c;
            word-break: break-word;
        }
        .detail-value img {
            max-width: 100%;
            border-radius: 16px;
            margin-top: 8px;
            border: 1px solid #e2e8f0;
            max-height: 350px;
            object-fit: contain;
            cursor: zoom-in;
        }
        .modal-map-btn {
            display: inline-block;
            background: #00b4d8;
            color: #fff;
            padding: 6px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .modal-map-btn:hover {
            background: #0095b6;
        }
        .empty-cell {
            color: #a0aec0;
            font-style: italic;
        }
        .modal-delete-btn {
            background: #e53e3e;
            border: none;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        .modal-delete-btn:hover {
            background: #c53030;
        }
        .modal-delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .image-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 8px;
        }
        .image-item {
            position: relative;
            background: #f7fafc;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .image-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: zoom-in;
            transition: transform 0.2s;
        }
        .image-item img:hover {
            transform: scale(1.02);
        }
        .image-item .image-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            font-size: 0.7rem;
            text-align: center;
        }
        .image-item .no-image-placeholder {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 0.85rem;
            background: #edf2f7;
        }
        @media (max-width: 600px) {
            .modal-box {
                padding: 20px 18px;
                max-width: 100%;
            }
            .detail-label {
                width: 80px;
                font-size: 0.85rem;
            }
            th,
            td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }
            .image-gallery {
                grid-template-columns: 1fr;
            }
            .image-item img {
                height: 150px;
            }
            .image-item .no-image-placeholder {
                height: 150px;
            }
        }
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }
        .lightbox-overlay.active {
            display: flex;
        }
        .lightbox-overlay img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            cursor: default;
            animation: fadeUp 0.2s ease;
        }
        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 1101;
        }
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 1101;
        }
        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .lightbox-nav.prev {
            left: 20px;
        }
        .lightbox-nav.next {
            right: 20px;
        }
        .lightbox-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1101;
        }
        .hidden-iframe {
            display: none;
        }
        .video-btn {
    background: #6c5ce7;
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
}
.video-btn:hover { background: #5646d6; transform: scale(1.05); }
.video-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 1200;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.video-overlay.active { display: flex; }
.video-box {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
}
.video-box iframe { width: 100%; height: 100%; border: 0; }
.video-close {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    width: 50px;
    height: 50px;
    border-radius: 50%;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 لوحة تحكم البيانات</h1>
        <div class="subtitle">الموقع · التوقيت · الصور الملتقطة (الأمامية والخلفية)</div>

        <button class="refresh-btn" onclick="fetchData()">🔄 تحديث البيانات</button>
        <button class="delete-all-btn" id="deleteAllBtn" onclick="deleteAllRows()">🗑️ حذف الكل</button>

        <div class="table-wrapper" id="tableWrapper">
            <div id="loadingMsg" class="status-msg">⏳ جاري تحميل البيانات من Google Sheets...</div>
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>التوقيت</th>
                        <th>المنطقة</th>
                        <th>الفيديو</th>
                        <th>الرابط</th>
                        <th>الصورة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="emptyMsg" class="status-msg" style="display: none;">📭 لا توجد بيانات لعرضها.</div>
        </div>
    </div>

    <!-- iframe مخفي لإرسال الطلبات -->
    <iframe id="hiddenIframe" name="hiddenIframe" class="hidden-iframe"></iframe>

    <!-- المودال -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle">تفاصيل الصف</div>
            <div id="modalBody"></div>
            <button class="modal-delete-btn" id="modalDeleteBtn" onclick="deleteRowFromModal()">🗑️ حذف هذا الصف</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">✕</button>
        <button class="lightbox-nav prev" onclick="event.stopPropagation(); navigateLightbox(-1)">‹</button>
        <button class="lightbox-nav next" onclick="event.stopPropagation(); navigateLightbox(1)">›</button>
        <img id="lightboxImage" src="" alt="معاينة مكبّرة" onclick="event.stopPropagation()" />
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <!-- نافذة الفيديو -->
<div class="video-overlay" id="videoOverlay" onclick="closeVideo()">
    <button class="video-close" onclick="event.stopPropagation(); closeVideo()">✕</button>
    <div class="video-box" onclick="event.stopPropagation()">
        <iframe id="videoFrame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

    <script>
        // =====================================================
        // الإعدادات
        // =====================================================
        const SHEET_ID = '1J_liU4icjkAcTAXB4CtLv1ONEVAFu9FRBGYll4oP9Hk';
        const SHEET_NAME = 'LocationLink';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwFCk8J4xYyQVJJUg582YNLim7WsRbEdCdLBHzj_6COGXQWAMYseeJ-Dv548xtxMIQo/exec';

        let currentRowIndex = null;
        let currentData = null;
        let allRows = [];
        let lightboxImages = [];
        let currentLightboxIndex = 0;
        let isDeleting = false;



function getVideoEmbedUrl(url) {
    if (!url) return '';
    const s = String(url);
    const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return m ? `https://drive.google.com/file/d/${m[1]}/preview` : '';
}

function openVideo(embedUrl) {
    if (!embedUrl) return;
    document.getElementById('videoFrame').src = embedUrl;
    document.getElementById('videoOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeVideo() {
    document.getElementById('videoFrame').src = '';
    document.getElementById('videoOverlay').classList.remove('active');
    const modalOpen = document.getElementById('detailModal').classList.contains('active');
    document.body.style.overflow = modalOpen ? 'hidden' : '';
}

        // =====================================================
        // جلب البيانات
        // =====================================================
        async function fetchData() {
            const table = document.getElementById('dataTable');
            const tbody = document.getElementById('tableBody');
            const loading = document.getElementById('loadingMsg');
            const empty = document.getElementById('emptyMsg');

            table.style.display = 'none';
            empty.style.display = 'none';
            loading.style.display = 'block';
            loading.textContent = '⏳ جاري تحميل البيانات...';
            loading.style.color = '#b0d4e8';

            try {
                const url = `${SCRIPT_URL}?sheetId=${SHEET_ID}&sheetName=${SHEET_NAME}`;
                console.log('📥 جلب البيانات من:', url);
                
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const result = await response.json();
                console.log('📥 تم استلام البيانات:', result);
                
                if (result.status !== 'success') {
                    throw new Error(result.message || 'خطأ في البيانات');
                }

   const rows = result.data || [];

allRows = [...rows];

rows.reverse();

                if (!rows || rows.length === 0) {
                    loading.style.display = 'none';
                    empty.style.display = 'block';
                    empty.textContent = '📭 لا توجد بيانات لعرضها.';
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach((row, index) => {
                    const newDate = row['newDate'] || '';
                    const linkLocation = row['linkLocation'] || '';
                    const latitude = row['latitude'] || '';
                    const longitude = row['longitude'] || '';
                    const timestamp = row['Timestamp'] || '';

                    const videoUrl = row['videoUrl'] || '';
                    const embedUrl = getVideoEmbedUrl(videoUrl);
                    const videoCell = embedUrl
                     ? `<button class="video-btn" onclick="event.stopPropagation(); openVideo('${embedUrl}')">▶ تشغيل</button>`
                    : '<span class="empty-cell">-</span>';

                    let locationName = row['LocationName'] ||
                        row['locationName'] ||
                        row['Location Name'] ||
                        row['المنطقة'] ||
                        row['اسم المنطقة'] ||
                        row['Location'] ||
                        '';

                    let imageData = row['imageData'] || '';

                    let imageHtml = '';
                    if (imageData && imageData.length > 100) {
                        let src = imageData;
                        if (!src.startsWith('data:image')) {
                            src = `data:image/jpeg;base64,${src}`;
                        }
                        imageHtml = `<img class="thumbnail" src="${src}" alt="صورة" />`;
                    } else {
                        imageHtml = `<div class="no-image">📷</div>`;
                    }

                    const linkHtml = (linkLocation && linkLocation.includes('google.com/maps')) ?
                        `<a href="${linkLocation}" target="_blank" class="map-link">🗺️ فتح</a>` :
                        (latitude && longitude ? `<a href="https://www.google.com/maps?q=${latitude},${longitude}" target="_blank" class="map-link">🗺️ فتح</a>` :
                            '-');

                    const coords = (latitude && longitude) ? `${latitude}, ${longitude}` : '-';

                    const actualRowIndex = row._rowNumber;

                    const tr = document.createElement('tr');
                    tr.setAttribute('data-index', index);
                    tr.setAttribute('data-row-index', actualRowIndex);
                    tr.innerHTML = `
                        <td class="row-number">${index + 1}</td>
                        <td>${timestamp || newDate || '-'}</td>
                        <td>${locationName || '-'}</td>
                        <td>${videoCell}</td>
                        <td>${linkHtml}</td>
                       <td>${imageHtml}</td>
<td>
    <button class="delete-btn" onclick="event.stopPropagation(); deleteRow(${actualRowIndex}, ${index})">🗑️ حذف</button>
</td>
                    `;

                    tr.addEventListener('click', () => {
                        openModal({
                            index: index + 1,
                            actualRowIndex: actualRowIndex,
                            timestamp: timestamp || newDate || '-',
                            locationName: locationName || '-',
                            latitude: latitude || '-',
                            longitude: longitude || '-',
                            linkLocation: linkLocation || (latitude && longitude ? `https://www.google.com/maps?q=${latitude},${longitude}` : ''),
                            imageData: imageData,
                            imageData2: row['imageData2'] || '',
                            imageData3: row['imageData3'] || '',
                            imageData4: row['imageData4'] || '',
                            videoUrl: videoUrl,
                            newDate: newDate
                        });
                    });

                    tbody.appendChild(tr);
                });

                loading.style.display = 'none';
                table.style.display = 'table';
                empty.style.display = 'none';

            } catch (error) {
                console.error('❌ خطأ في جلب البيانات:', error);
                loading.textContent = '❌ فشل في تحميل البيانات. تأكد من تشغيل الملف عبر خادم محلي (Live Server)';
                loading.style.color = '#e53e3e';
                table.style.display = 'none';
                empty.style.display = 'none';
            }
        }

        // =====================================================
        // حذف صف باستخدام iframe (طريقة تعمل دائماً)
        // =====================================================
       function deleteRow(rowIndex, displayIndex) {
    if (isDeleting) return;

    if (!confirm(`⚠️ هل أنت متأكد من حذف الصف رقم ${displayIndex + 1}؟`)) {
        return;
    }

    const rowElement = document.querySelector(
        `tr[data-row-index="${rowIndex}"]`
    );

    const btn = rowElement?.querySelector('.delete-btn');

    if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ جاري الحذف...';
    }

    isDeleting = true;

    try {

        const form = document.createElement('form');

        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = 'hiddenIframe';
        form.style.display = 'none';

        const fields = {
          action: 'delete',
sheetId: SHEET_ID,
sheetName: SHEET_NAME,
_rowNumber: rowIndex
        };

        Object.keys(fields).forEach(key => {

            const input = document.createElement('input');

            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];

            form.appendChild(input);
        });

        document.body.appendChild(form);

        // إرسال الطلب إلى Google Apps Script
        form.submit();

        // إزالة النموذج بعد الإرسال
        setTimeout(() => {

            if (form.parentNode) {
                form.parentNode.removeChild(form);
            }

        }, 1000);

        // ==========================================
        // انتظار تنفيذ Google Apps Script
        // ثم إعادة قراءة البيانات من Google Sheets
        // ==========================================
        setTimeout(async () => {

            try {

                await fetchData();

            } catch (error) {

                console.error(
                    '❌ خطأ أثناء تحديث البيانات:',
                    error
                );

            } finally {

                isDeleting = false;

            }

        }, 2500);

    } catch (error) {

        console.error(
            '❌ خطأ في إرسال طلب الحذف:',
            error
        );

        if (btn) {
            btn.disabled = false;
            btn.textContent = '🗑️ حذف';
        }

        isDeleting = false;

        alert(
            '❌ تعذر إرسال طلب الحذف\n\n' +
            error.message
        );
    }
}

        // =====================================================
        // تحديث أرقام الصفوف
        // =====================================================
        function updateRowNumbers() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                const numberCell = row.querySelector('.row-number');
                if (numberCell) {
                    numberCell.textContent = index + 1;
                }
            });
        }

        // =====================================================
        // حذف جميع الصفوف
        // =====================================================
        function deleteAllRows() {
            if (isDeleting) return;
            
            if (allRows.length === 0) {
                alert('لا توجد بيانات لحذفها.');
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من حذف جميع الصفوف (${allRows.length} صف)؟ لا يمكن التراجع عن هذا الإجراء!`)) return;

            const btn = document.getElementById('deleteAllBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري حذف الكل...';
            isDeleting = true;

            try {
                // حذف كل صف على حدة باستخدام iframe
                const sortedRows = [...allRows].sort((a, b) => (b._rowNumber || 0) - (a._rowNumber || 0));
                let count = 0;
                
                sortedRows.forEach((row, index) => {
                    const rowIndex = row._rowNumber;
                    if (rowIndex) {
                        setTimeout(() => {
                            const form = document.createElement('form');
                            form.method = 'POST';
                            form.action = SCRIPT_URL;
                            form.target = 'hiddenIframe';
                            form.style.display = 'none';
                            
                            const fields = {
                              action: 'delete',
sheetId: SHEET_ID,
sheetName: SHEET_NAME,
_rowNumber: rowIndex
                            };
                            
                            Object.keys(fields).forEach(key => {
                                const input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = key;
                                input.value = fields[key];
                                form.appendChild(input);
                            });
                            
                            document.body.appendChild(form);
                            form.submit();
                            
                            setTimeout(() => {
                                document.body.removeChild(form);
                            }, 500);
                            
                            count++;
                        }, index * 500);
                    }
                });
                
                // بعد الانتهاء من الحذف
                setTimeout(() => {
                    alert(`✅ تم حذف ${count} صف بنجاح`);
                    fetchData();
                    btn.disabled = false;
                    btn.textContent = '🗑️ حذف الكل';
                    isDeleting = false;
                }, (sortedRows.length * 500) + 1000);

            } catch (error) {
                console.error('خطأ في حذف جميع الصفوف:', error);
                alert('❌ فشل في حذف جميع الصفوف: ' + error.message);
                btn.disabled = false;
                btn.textContent = '🗑️ حذف الكل';
                isDeleting = false;
            }
        }

        // =====================================================
        // المودال - عرض جميع الصور
        // =====================================================
        function getImageSrc(imageData) {
            if (imageData && imageData.length > 100) {
                let src = imageData;
                if (!src.startsWith('data:image')) {
                    src = `data:image/jpeg;base64,${src}`;
                }
                return src;
            }
            return null;
        }

        function createImageElement(src, label) {
            if (src) {
                return `
                    <div class="image-item">
                        <img src="${src}" alt="${label}" onclick="event.stopPropagation(); openLightbox('${src}')" />
                        <div class="image-label">${label}</div>
                    </div>
                `;
            } else {
                return `
                    <div class="image-item">
                        <div class="no-image-placeholder">📷 لا توجد صورة</div>
                        <div class="image-label">${label}</div>
                    </div>
                `;
            }
        }

        function openModal(data) {
            const overlay = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const deleteBtn = document.getElementById('modalDeleteBtn');

            currentRowIndex = data.actualRowIndex;
            currentData = data;

            title.textContent = `📌 تفاصيل الصف #${data.index}`;

            const images = [
                { data: data.imageData, label: '📸 الكاميرا الأمامية 1' },
                { data: data.imageData2, label: '📸 الكاميرا الأمامية 2' },
                { data: data.imageData3, label: '📷 الكاميرا الخلفية 1' },
                { data: data.imageData4, label: '📷 الكاميرا الخلفية 2' }
            ];

            lightboxImages = [];
            let galleryHtml = '<div class="image-gallery">';
            
            images.forEach((img) => {
                const src = getImageSrc(img.data);
                if (src) {
                    lightboxImages.push(src);
                }
                galleryHtml += createImageElement(src, img.label);
            });
            galleryHtml += '</div>';

            if (lightboxImages.length === 0) {
                galleryHtml = '<p style="color: #a0aec0; text-align: center; padding: 20px;">📭 لا توجد صور لعرضها</p>';
            }

            body.innerHTML = `
                <div class="detail-item">
                    <span class="detail-label">🕒 التوقيت</span>
                    <span class="detail-value">${data.timestamp}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">📍 المنطقة</span>
                    <span class="detail-value">${data.locationName}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">🌐 خط العرض</span>
                    <span class="detail-value">${data.latitude}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">🌐 خط الطول</span>
                    <span class="detail-value">${data.longitude}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">🗺️ الخريطة</span>
                    <span class="detail-value">
                        ${data.linkLocation && data.linkLocation !== '-' ? `<a href="${data.linkLocation}" target="_blank" class="modal-map-btn">📍 عرض الموقع على الخريطة</a>` : 'لا يوجد رابط'}
                    </span>
                </div>
                <div class="detail-item">
    <span class="detail-label">🎬 الفيديو</span>
    <span class="detail-value">
        ${getVideoEmbedUrl(data.videoUrl)
            ? `<button class="video-btn" onclick="openVideo('${getVideoEmbedUrl(data.videoUrl)}')">▶ تشغيل الفيديو</button>`
            : 'لا يوجد فيديو'}
    </span>
</div>
                <div class="detail-item" style="border-bottom: none; flex-direction: column; align-items: stretch;">
                    <span class="detail-label" style="margin-bottom: 8px;">🖼️ جميع الصور</span>
                    <div class="detail-value">${galleryHtml}</div>
                </div>
            `;

            deleteBtn.style.display = 'block';
            deleteBtn.disabled = false;
            deleteBtn.textContent = '🗑️ حذف هذا الصف';

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
            currentRowIndex = null;
            currentData = null;
        }

        // =====================================================
        // حذف من المودال
        // =====================================================
        function deleteRowFromModal() {
            if (isDeleting) return;
            
            if (!currentRowIndex) {
                alert('لا يوجد صف محدد للحذف.');
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من حذف هذا الصف؟`)) return;

            const btn = document.getElementById('modalDeleteBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحذف...';
            isDeleting = true;

            try {
                // استخدام iframe
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = SCRIPT_URL;
                form.target = 'hiddenIframe';
                form.style.display = 'none';
                
                const fields = {
                 action: 'delete',
sheetId: SHEET_ID,
sheetName: SHEET_NAME,
_rowNumber: currentRowIndex
                };
                
                Object.keys(fields).forEach(key => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
                
                setTimeout(() => {
                    document.body.removeChild(form);
                }, 1000);
                
                setTimeout(() => {
                    closeModal();
                    alert('✅ تم حذف الصف بنجاح');
                    fetchData();
                    isDeleting = false;
                }, 2000);

            } catch (error) {
                console.error('❌ خطأ في حذف الصف:', error);
                alert('❌ فشل في حذف الصف: ' + error.message);
                btn.disabled = false;
                btn.textContent = '🗑️ حذف هذا الصف';
                isDeleting = false;
            }
        }

        // =====================================================
        // Lightbox
        // =====================================================
        function openLightbox(src) {
            src = src.replace(/^['"]|['"]$/g, '');
            
            const lightbox = document.getElementById('lightboxOverlay');
            
            currentLightboxIndex = lightboxImages.indexOf(src);
            if (currentLightboxIndex === -1) {
                lightboxImages.push(src);
                currentLightboxIndex = lightboxImages.length - 1;
            }
            
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateLightbox() {
            const lightboxImg = document.getElementById('lightboxImage');
            const counter = document.getElementById('lightboxCounter');
            
            if (lightboxImages.length > 0 && currentLightboxIndex >= 0 && currentLightboxIndex < lightboxImages.length) {
                lightboxImg.src = lightboxImages[currentLightboxIndex];
                counter.textContent = `${currentLightboxIndex + 1} / ${lightboxImages.length}`;
                counter.style.display = 'block';
            } else {
                counter.style.display = 'none';
            }
        }

     function closeLightbox() {
    document.getElementById('lightboxOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

        function navigateLightbox(direction) {
            if (lightboxImages.length === 0) return;
            
            currentLightboxIndex = (currentLightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
            updateLightbox();
        }

        // =====================================================
        // أحداث
        // =====================================================
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
    if (document.getElementById('videoOverlay').classList.contains('active')) {
        closeVideo();
        return;
    }
    const lightbox = document.getElementById('lightboxOverlay');
    if (lightbox.classList.contains('active')) {
        closeLightbox();
    } else {
        closeModal();
    }
}
            if (e.key === 'ArrowLeft' && document.getElementById('lightboxOverlay').classList.contains('active')) {
                navigateLightbox(-1);
            }
            if (e.key === 'ArrowRight' && document.getElementById('lightboxOverlay').classList.contains('active')) {
                navigateLightbox(1);
            }
        });

        // =====================================================
        // التشغيل
        // =====================================================
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
